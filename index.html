<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Embakasi Garrison Comprehensive School Meal Management System — School Meal Ledger</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Zilla+Slab:wght@500;600;700&family=Libre+Franklin:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
<style>
:root{
  --ink:#1B3A34;--ink-2:#24463F;--ink-3:#163029;--paper:#FBF7EE;--card:#FFFFFF;
  --maize:#E8A93D;--maize-dark:#C88A22;--leaf:#4C7A6B;--leaf-soft:#DCE8E2;
  --rust:#B84C3E;--rust-soft:#F5DFDA;--charcoal:#262421;--muted:#6B675F;--line:#E4DCC8;
  --shadow: 0 1px 2px rgba(27,58,52,0.06), 0 6px 20px rgba(27,58,52,0.07);
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{font-family:'Libre Franklin', sans-serif;background:var(--paper);color:var(--charcoal);-webkit-font-smoothing:antialiased;}
h1,h2,h3,h4{ font-family:'Zilla Slab', serif; margin:0; color:var(--ink); letter-spacing:-0.01em;}
.mono{font-family:'IBM Plex Mono', monospace;}
button{font-family:inherit; cursor:pointer;}
input,select,textarea{font-family:inherit;}
::selection{ background: var(--maize); color:#fff;}

#app{ display:flex; min-height:100vh; }
.sidebar{width:230px; flex-shrink:0; background:var(--ink);color:#EFE9DA; display:flex; flex-direction:column;position:sticky; top:0; height:100vh;}
.brand{ padding:22px 20px 14px; border-bottom:1px solid rgba(255,255,255,0.08); }
.brand .stamp{width:38px;height:38px;border-radius:50%;border:2px dashed var(--maize);display:flex;align-items:center;justify-content:center;font-family:'Zilla Slab',serif;font-weight:700;color:var(--maize);font-size:16px;margin-bottom:8px;}
.brand h1{ color:#fff; font-size:19px; line-height:1.15; }
.brand p{ margin:4px 0 0; font-size:11.5px; color:#9FB8AF; letter-spacing:0.04em; text-transform:uppercase;}
nav.navlist{ padding:14px 10px; display:flex; flex-direction:column; gap:2px; flex:1; overflow:auto;}
nav.navlist button{all:unset; display:flex; align-items:center; gap:10px; padding:10px 12px; border-radius:8px;color:#CBD9D3; font-size:14.5px; font-weight:500;cursor:pointer;}
nav.navlist button .ic{ font-size:15px; width:18px; text-align:center;}
nav.navlist button:hover{ background:rgba(255,255,255,0.06); color:#fff;}
nav.navlist button.active{ background:var(--maize); color:var(--ink-3); font-weight:700;}
.sidebar-foot{ padding:14px 18px 18px; font-size:11px; color:#7E9A90; border-top:1px solid rgba(255,255,255,0.08);}

.content{ flex:1; min-width:0; display:flex; flex-direction:column;}
.topbar{background:var(--card); border-bottom:1px solid var(--line); padding:16px 28px;display:flex; align-items:center; justify-content:space-between; position:sticky; top:0; z-index:5;}
.topbar h2{ font-size:22px; }
.topbar .sub{ color:var(--muted); font-size:13px; margin-top:2px;}
.view{ padding:26px 28px 60px; max-width:1240px; }

.grid{ display:grid; gap:16px; }
.cols-4{ grid-template-columns:repeat(4,1fr); }
.cols-3{ grid-template-columns:repeat(3,1fr); }
.cols-2{ grid-template-columns:repeat(2,1fr); }
@media (max-width:1000px){ .cols-4{grid-template-columns:repeat(2,1fr);} .cols-3{grid-template-columns:repeat(2,1fr);} }
@media (max-width:760px){ .sidebar{display:none;} .cols-2,.cols-3,.cols-4{grid-template-columns:1fr;} .view{padding:18px 14px 60px;} }

.stat-card{background:var(--card); border:1px solid var(--line); border-radius:12px; padding:18px 18px;box-shadow:var(--shadow);}
.stat-card .label{ font-size:11.5px; text-transform:uppercase; letter-spacing:0.06em; color:var(--muted); font-weight:600;}
.stat-card .value{ font-family:'Zilla Slab',serif; font-size:28px; color:var(--ink); margin-top:6px; font-weight:700;}
.stat-card .delta{ font-size:12.5px; margin-top:6px; color:var(--leaf); font-weight:600;}
.stat-card .delta.down{ color:var(--rust); }

.panel{background:var(--card); border:1px solid var(--line); border-radius:12px; padding:20px 22px;box-shadow:var(--shadow); margin-bottom:18px;}
.panel-head{ display:flex; align-items:center; justify-content:space-between; margin-bottom:14px; gap:10px; flex-wrap:wrap;}
.panel-head h3{ font-size:17px; }
.tag{ display:inline-block; font-size:11px; font-weight:600; padding:3px 9px; border-radius:99px; background:var(--leaf-soft); color:var(--leaf); }
.tag.warn{ background:var(--rust-soft); color:var(--rust); }
.tag.gold{ background:#FBEAC9; color:var(--maize-dark); }

.btn{ border:none; border-radius:8px; padding:9px 16px; font-size:13.5px; font-weight:600; display:inline-flex; align-items:center; gap:6px; }
.btn-primary{ background:var(--maize); color:var(--ink-3); }
.btn-primary:hover{ background:var(--maize-dark); }
.btn-ghost{ background:transparent; color:var(--ink); border:1px solid var(--line); }
.btn-ghost:hover{ background:var(--leaf-soft); }
.btn-danger{ background:var(--rust-soft); color:var(--rust); }
.btn-danger:hover{ background:#eec6bd; }
.btn-sm{ padding:6px 11px; font-size:12.5px; border-radius:7px;}
.btn:disabled{ opacity:0.5; cursor:not-allowed; }

input[type=text], input[type=number], input[type=date], input[type=month], input[type=search], input[type=password], select, textarea{
  border:1px solid var(--line); border-radius:8px; padding:9px 11px; font-size:13.5px; color:var(--charcoal);background:#fff; width:100%;
}
input:focus, select:focus, textarea:focus{ outline:2px solid var(--maize); outline-offset:1px; border-color:var(--maize); }
label{ font-size:12.5px; font-weight:600; color:var(--ink); display:block; margin-bottom:5px;}
.field{ margin-bottom:12px; }
.field-row{ display:flex; gap:12px; }
.field-row > *{ flex:1; }

table{ width:100%; border-collapse:collapse; font-size:13.5px; }
thead th{ text-align:left; font-size:11px; text-transform:uppercase; letter-spacing:0.05em; color:var(--muted); padding:8px 10px; border-bottom:2px solid var(--line); }
tbody td{ padding:9px 10px; border-bottom:1px solid var(--line); vertical-align:middle;}
tbody tr:hover{ background:#FAF6EA; }
.balance-low{ color:var(--rust); font-weight:700; }
.balance-ok{ color:var(--leaf); font-weight:700; }

.search-row{ display:flex; gap:10px; margin-bottom:14px; flex-wrap:wrap; }
.search-row > *{ min-width:160px; }
.search-row .grow{ flex:1; min-width:220px;}

.empty{ text-align:center; padding:40px 20px; color:var(--muted); }
.empty h4{ color:var(--ink); margin-bottom:6px;}

.modal-bg{ position:fixed; inset:0; background:rgba(22,48,41,0.45); display:flex; align-items:center; justify-content:center; z-index:50; padding:20px;}
.modal{ background:var(--card); border-radius:14px; max-width:560px; width:100%; max-height:90vh; overflow:auto; padding:24px 26px; box-shadow:0 20px 60px rgba(0,0,0,0.25);}
.modal h3{ font-size:19px; margin-bottom:14px;}
.modal-actions{ display:flex; justify-content:flex-end; gap:10px; margin-top:18px;}

.toast-wrap{ position:fixed; bottom:20px; right:20px; z-index:100000; display:flex; flex-direction:column; gap:8px;}
.toast{ background:var(--ink); color:#fff; padding:11px 16px; border-radius:9px; font-size:13.5px; box-shadow:var(--shadow); border-left:4px solid var(--maize); animation:slidein 0.2s ease;}
.toast.error{ border-left-color:var(--rust); }
@keyframes slidein{ from{ transform:translateX(20px); opacity:0;} to{transform:translateX(0); opacity:1;} }

.loading-screen{ position:fixed; inset:0; background:var(--paper); display:flex; flex-direction:column; align-items:center; justify-content:center; gap:14px; z-index:200;}
.spinner{ width:34px; height:34px; border-radius:50%; border:3px solid var(--line); border-top-color:var(--maize); animation:spin 0.8s linear infinite;}
@keyframes spin{ to{ transform:rotate(360deg);} }

.mealcard{width:84mm; height:54mm; border-radius:8px; background:linear-gradient(135deg,#fff,#FBF4E2);border:1.4px solid var(--ink); position:relative; padding:8px 9px; overflow:hidden;display:flex; flex-direction:column; justify-content:space-between; color:var(--ink);box-shadow:var(--shadow);}
.mealcard::before{content:""; position:absolute; right:-16px; top:-16px; width:70px; height:70px; border-radius:50%;border:2.5px dashed var(--maize); opacity:0.55;}
.mealcard .mc-top{ display:flex; justify-content:space-between; align-items:flex-start; }
.mealcard .mc-school{ font-family:'Zilla Slab',serif; font-weight:700; font-size:10px; text-transform:uppercase; letter-spacing:0.03em; max-width:65%;}
.mealcard .mc-badge{ background:var(--ink); color:var(--maize); font-size:8px; font-weight:700; padding:3px 6px; border-radius:5px; letter-spacing:0.04em;}
.mealcard .mc-name{ font-family:'Zilla Slab',serif; font-weight:700; font-size:14px; margin-top:5px; line-height:1.1;}
.mealcard .mc-meta{ font-size:8.8px; color:var(--muted); margin-top:3px; display:flex; gap:8px; flex-wrap:wrap;}
.mealcard .mc-valid-title{font-size:7px;text-transform:uppercase;font-weight:700;letter-spacing:.05em;color:var(--muted);margin-top:3px;}
.mealcard .mc-days{display:flex;gap:3px;align-items:center;margin-top:3px;flex-wrap:wrap;}
.mealcard .mc-day{width:18px;height:18px;border:1px solid var(--ink);border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:7px;font-weight:700;background:#fff;position:relative;flex:0 0 auto;}
.mealcard .mc-day.active{background:var(--maize);border-color:var(--maize-dark);color:var(--ink-3);}
.mealcard .mc-day.past{opacity:.38;}
.mealcard .mc-day small{position:absolute;top:18px;font-size:5px;color:var(--muted);font-weight:500;}
.mealcard .mc-pay{margin-top:4px;border:1px solid #E4D1A6;border-radius:5px;background:#FFF9EA;padding:3px 5px;font-size:5.8px;line-height:1.35;color:var(--muted);}
.mealcard .mc-pay b{display:block;color:var(--ink);font-size:5.8px;text-transform:uppercase;letter-spacing:.05em;margin-bottom:1px;}
.mealcard .mc-bottom{ display:flex; justify-content:space-between; align-items:flex-end; }
.mealcard .mc-num{ font-family:'IBM Plex Mono',monospace; font-size:11px; font-weight:600; letter-spacing:0.04em;}
.mealcard .mc-line{ font-size:6.5px; color:var(--muted); text-transform:uppercase; letter-spacing:0.05em;}
.card-grid-print{ display:flex; flex-direction:column; align-items:center; gap:4mm; }

@media print{
  body *{ visibility:hidden; }
  #print-area, #print-area *{ visibility:visible; }
  #print-area{ position:absolute; left:0; top:0; width:100%; padding:8mm;}
  .mealcard{ box-shadow:none; break-inside:avoid; }
  .learner-print-sheet{padding:10mm;color:#222;font-family:Arial,sans-serif;}
  @page{ margin:8mm; }
}

.chart-bars{ display:flex; align-items:flex-end; gap:8px; height:140px; padding-top:10px; }
.chart-bars .bar-wrap{ flex:1; display:flex; flex-direction:column; align-items:center; gap:6px; }
.chart-bars .bar{ width:100%; background:var(--leaf); border-radius:5px 5px 0 0; min-height:3px; }
.chart-bars .bar.today{ background:var(--maize); }
.chart-bars .bar-label{ font-size:10.5px; color:var(--muted); }
.chart-bars .bar-val{ font-size:10px; color:var(--ink); font-weight:600;}

.sms-box{ background:#F5F0E1; border:1px dashed var(--line); border-radius:9px; padding:12px 14px; font-family:'IBM Plex Mono',monospace; font-size:12.5px; white-space:pre-wrap; color:var(--ink);}
.kv{ display:flex; justify-content:space-between; padding:7px 0; border-bottom:1px solid var(--line); font-size:13px;}
.kv .k{ color:var(--muted); }
.kv .v{ font-weight:600; }

.tabs{ display:flex; gap:4px; margin-bottom:16px; border-bottom:1px solid var(--line); }
.tabs button{ all:unset; padding:9px 16px; font-size:13.5px; font-weight:600; color:var(--muted); border-bottom:2px solid transparent; cursor:pointer;}
.tabs button.active{ color:var(--ink); border-bottom-color:var(--maize); }

.pagination{ display:flex; align-items:center; gap:8px; justify-content:flex-end; margin-top:12px; font-size:13px; color:var(--muted);}
.pagination button{ background:none; border:1px solid var(--line); border-radius:6px; padding:5px 10px;}
.pagination button:disabled{ opacity:0.4; }

.dropzone{ border:2px dashed var(--line); border-radius:10px; padding:26px; text-align:center; color:var(--muted); font-size:13.5px; }
.dropzone.drag{ border-color:var(--maize); background:#FBF4E2; }
.helptext{ font-size:12px; color:var(--muted); margin-top:5px; }

.learner-print-sheet{background:#fff;color:#222;max-width:760px;margin:auto;padding:20px;}
.learner-print-sheet h1{font-size:24px;margin-bottom:4px;}
.learner-print-sheet h2{font-size:18px;margin-bottom:18px;}
.print-kv{display:flex;justify-content:space-between;padding:9px 0;border-bottom:1px solid #ddd;font-size:13px;}
.print-kv b{color:#555;}

#loginScreen{position:fixed;inset:0;z-index:99999;display:flex;align-items:center;justify-content:center;background:radial-gradient(circle at 20% 20%,rgba(232,169,61,.12),transparent 32%),radial-gradient(circle at 80% 80%,rgba(76,122,107,.16),transparent 35%),#10231f;}
.login-box{width:390px;max-width:calc(100% - 34px);background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.16);border-radius:20px;padding:34px;box-shadow:0 25px 80px rgba(0,0,0,.45);backdrop-filter:blur(14px);animation:loginIn .6s ease;}
.login-logo{width:68px;height:68px;border-radius:18px;background:var(--maize);color:var(--ink-3);display:flex;align-items:center;justify-content:center;font-family:'Zilla Slab',serif;font-size:25px;font-weight:700;margin:0 auto 16px;box-shadow:0 0 30px rgba(232,169,61,.25);}
.login-logo img{width:100%;height:100%;object-fit:contain;border-radius:18px;display:block;}
.login-box h2{text-align:center;color:#fff;font-size:26px;margin:0;}
.login-box p{text-align:center;color:#b9cbc4;font-size:12px;margin:6px 0 25px;}
.login-field{margin-bottom:15px;}
.login-field label{color:#dce8e2;margin-bottom:6px;}
.login-field input{background:rgba(0,0,0,.25)!important;color:#fff!important;border:1px solid rgba(255,255,255,.18)!important;}
.login-field input::placeholder{color:#91a69e!important;}
.login-btn{width:100%;padding:12px;border:0;border-radius:9px;background:var(--maize);color:var(--ink-3);font-weight:700;font-size:14px;cursor:pointer;}
.login-btn:hover{background:#f0b957;}
.login-btn:disabled{opacity:.6;}
.login-error{display:none;background:rgba(184,76,62,.18);border:1px solid rgba(255,150,130,.25);color:#ffb7a8;border-radius:8px;padding:9px;text-align:center;font-size:12px;margin-bottom:12px;}
.login-error.show{display:block;}
#loginScreen.hidden{opacity:0;visibility:hidden;pointer-events:none;transition:.45s ease;}
@keyframes loginIn{from{opacity:0;transform:translateY(20px) scale(.97)}to{opacity:1;transform:none}}
</style>
</head>
<body>
<div id="loginScreen">
  <div class="login-box">
    <div class="login-logo"><img src="logo.png" alt="Embakasi Logo" onerror="this.parentNode.textContent='EGS'"></div>
    <h2>EMBAKASI</h2>
    <p>Garrison Comprehensive School · Meal Management System</p>
    <div class="login-error" id="loginError">Incorrect username or password.</div>
    <div class="login-field"><label>Username</label><input type="text" id="loginUser" placeholder="Enter username" autocomplete="username"></div>
    <div class="login-field"><label>Password</label><input type="password" id="loginPass" placeholder="Enter password" autocomplete="current-password"></div>
    <button class="login-btn" id="loginBtn">LOGIN</button>
  </div>
</div>

<div id="loading" class="loading-screen"><div class="spinner"></div><div style="font-family:'Zilla Slab',serif;color:var(--ink);font-size:15px;">Opening the ledger…</div></div>

<div id="app" style="display:none;">
  <aside class="sidebar">
    <div class="brand">
      <div class="stamp">EG</div>
      <h1>Embakasi Garrison Meal Management System</h1>
      <p>Meal Wallet Ledger</p>
    </div>
    <nav class="navlist" id="nav"></nav>
    <div class="sidebar-foot" id="sidebarFoot">View learners · shared ledger</div>
  </aside>
  <div class="content">
    <div class="topbar">
      <div>
        <h2 id="viewTitle">Dashboard</h2>
        <div class="sub" id="viewSub">Today, everything at a glance</div>
      </div>
      <div id="topbarActions"></div>
    </div>
    <div class="view" id="viewRoot"></div>
  </div>
</div>

<div id="modalRoot"></div>
<div id="printArea" style="display:none;"></div>
<div class="toast-wrap" id="toastWrap"></div>
<script>
/* ===== Embakasi Garrison Meal Management System — core ===== */
let STATE = {
  learners: [], txnMonths: [], txnCache: {},
  settings: { school_name: "Embakasi Garrison Comprehensive School", daily_rate: 80, card_prefix: "MC" },
  view: 'dashboard', loaded: false
};

async function storeGet(key, fallback){
  try{ const raw = localStorage.getItem('embakasi_'+key); return raw === null ? fallback : JSON.parse(raw); }
  catch(e){ return fallback; }
}
async function storeSet(key, value){
  try{ localStorage.setItem('embakasi_'+key, JSON.stringify(value)); return true; }
  catch(e){ toast('Storage error saving "'+key+'"', true); return null; }
}
async function loadAll(){
  STATE.settings = Object.assign(STATE.settings, await storeGet('settings', {}));
  STATE.loaded = true;
}
async function ensureMonthLoaded(monthKey){ STATE.txnCache[monthKey] = STATE.txnCache[monthKey] || []; return STATE.txnCache[monthKey]; }
async function saveLearners(){ await storeSet('learners', STATE.learners); }
async function saveSettings(){ await storeSet('settings', STATE.settings); }
async function saveMonth(monthKey){ await storeSet('txns:'+monthKey, STATE.txnCache[monthKey] || []); }

function uid(){ return Date.now().toString(36)+Math.random().toString(36).slice(2,7); }
function monthKeyOf(dateStr){ return dateStr.slice(0,7); }
function todayISO(){ const d=new Date(); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
function fmtMoney(n){ return 'KSh ' + Number(n||0).toLocaleString('en-KE', {maximumFractionDigits:0}); }
function fmtDate(d){ const dt = new Date(d+'T00:00:00'); return dt.toLocaleDateString('en-GB', {day:'2-digit',month:'short',year:'numeric'}); }
function escapeHtml(s){ return String(s??'').replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

function toast(msg, isError){
  const wrap = document.getElementById('toastWrap');
  const el = document.createElement('div');
  el.className = 'toast'+(isError?' error':'');
  el.textContent = msg;
  wrap.appendChild(el);
  setTimeout(()=>{ el.remove(); }, 3800);
}

function nextCardNumber(){
  const prefix = STATE.settings.card_prefix || 'MC';
  let max = 0;
  STATE.learners.forEach(l=>{ const m = (l.card_no||'').match(/(\d+)$/); if(m) max = Math.max(max, parseInt(m[1],10)); });
  return prefix + '-' + String(max+1).padStart(6,'0');
}
function findLearner(id){ return STATE.learners.find(l=>l.id===id); }
function allTxnsFlat(){
  let out = [];
  for(const m of STATE.txnMonths){ out = out.concat((STATE.txnCache[m]||[]).map(t=>({...t, month:m}))); }
  return out.sort((a,b)=> a.date < b.date ? 1 : -1);
}
function txnsInRange(startISO, endISO){ return allTxnsFlat().filter(t=> t.date >= startISO && t.date <= endISO); }
function startOfWeek(d){
  const dt = new Date(d+'T00:00:00');
  const day = (dt.getDay()+6)%7;
  dt.setDate(dt.getDate()-day);
  return dt.getFullYear()+'-'+String(dt.getMonth()+1).padStart(2,'0')+'-'+String(dt.getDate()).padStart(2,'0');
}

/* ----- meal card validity ----- */
const DEFAULT_VALIDITY_DAYS = 13;
function addSchoolDays(startISO, count){
  const dates = [];
  const d = new Date((startISO || todayISO()) + 'T00:00:00');
  while(dates.length < count){
    const day = d.getDay();
    if(day !== 0 && day !== 6) dates.push(d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'));
    d.setDate(d.getDate()+1);
  }
  return dates;
}
function learnerMealDays(l){
  const rate = Number(STATE.settings.daily_rate || 80);
  const balance = Math.max(0, Number(l.balance || 0));
  return rate > 0 ? Math.floor(balance / rate) : 0;
}
function learnerMealBalance(l){
  const rate = Number(STATE.settings.daily_rate || 80);
  const balance = Math.max(0, Number(l.balance || 0));
  return rate > 0 ? balance % rate : balance;
}
function learnerValidDates(l){
  const mealDays = Math.min(learnerMealDays(l), 66);
  return mealDays > 0 ? addSchoolDays(todayISO(), mealDays) : [];
}

/* ----- navigation ----- */
const NAV_ITEMS = [
  {id:'dashboard', label:'Dashboard', icon:'&#9670;'},
  {id:'learners', label:'Learners', icon:'&#9787;'},
  {id:'payments', label:'Payments', icon:'&#8383;'},
  {id:'reports', label:'Reports', icon:'&#9636;'},
  {id:'cards', label:'Meal Cards', icon:'&#9635;'},
  {id:'settings', label:'Settings', icon:'&#9881;'},
];
const VIEW_TITLES = {
  dashboard:['Dashboard','Today, everything at a glance'],
  learners:['Learners','View learners · register, import, search'],
  payments:['Payments','Verify a bank notification and credit a wallet'],
  reports:['Reports','Daily, weekly, monthly and termly collections'],
  cards:['Meal Cards','Generate and print meal wallet cards'],
  settings:['Settings','School details and defaults'],
};
function renderNav(){
  const nav = document.getElementById('nav');
  nav.innerHTML = NAV_ITEMS.map(it=>
    `<button data-view="${it.id}" class="${STATE.view===it.id?'active':''}"><span class="ic">${it.icon}</span>${it.label}</button>`
  ).join('');
  nav.querySelectorAll('button').forEach(b=>{ b.onclick = ()=> setView(b.dataset.view); });
}
function setView(v){
  STATE.view = v;
  renderNav();
  document.getElementById('viewTitle').textContent = VIEW_TITLES[v][0];
  document.getElementById('viewSub').textContent = VIEW_TITLES[v][1];
  document.getElementById('topbarActions').innerHTML = '';
  const root = document.getElementById('viewRoot');
  root.innerHTML = '';
  ({dashboard: renderDashboard, learners: renderLearners, payments: renderPayments, reports: renderReports, cards: renderCards, settings: renderSettings})[v](root);
  const actions = document.getElementById('topbarActions');
  const out = document.createElement('button');
  out.className='btn btn-ghost btn-sm'; out.textContent='Logout'; out.style.marginLeft='8px'; out.onclick=logoutUser;
  actions.appendChild(out);
}
function logoutUser(){ location.reload(); }

function openModal(html, onMount){
  const root = document.getElementById('modalRoot');
  root.innerHTML = `<div class="modal-bg" id="modalBg"><div class="modal">${html}</div></div>`;
  document.getElementById('modalBg').addEventListener('mousedown', (e)=>{ if(e.target.id==='modalBg') closeModal(); });
  if(onMount) onMount(root);
}
function closeModal(){ document.getElementById('modalRoot').innerHTML=''; }

(async function init(){
  await loadAll();
  document.getElementById('loading').style.display='none';
  document.getElementById('app').style.display='flex';
  renderNav();
  setView('dashboard');
})();
</script>
<script>
/* ===== Dashboard ===== */
function renderDashboard(root){
  const today = todayISO();
  const weekStart = startOfWeek(today);
  const monthStart = today.slice(0,7)+'-01';
  const todayTxns = txnsInRange(today, today);
  const weekTxns = txnsInRange(weekStart, today);
  const monthTxns = txnsInRange(monthStart, today);
  const sum = arr => arr.reduce((a,t)=>a+Number(t.amount||0),0);
  const totalBalance = STATE.learners.reduce((a,l)=>a+Number(l.balance||0),0);
  const lowBalance = STATE.learners.filter(l=> Number(l.balance||0) < Number(STATE.settings.daily_rate||80)).length;
  const days = [];
  for(let i=6;i>=0;i--){
    const d = new Date(); d.setDate(d.getDate()-i);
    const iso = d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
    days.push({iso, label: d.toLocaleDateString('en-GB',{weekday:'short'}), total: sum(txnsInRange(iso,iso))});
  }
  const maxDay = Math.max(1, ...days.map(d=>d.total));
  const byClass = {};
  monthTxns.forEach(t=>{ const l = findLearner(t.learner_id); const k = l ? (l.klass||'—') : '—'; byClass[k] = (byClass[k]||0) + Number(t.amount||0); });
  const classRows = Object.entries(byClass).sort((a,b)=>b[1]-a[1]).slice(0,6);

  root.innerHTML = `
    <div class="grid cols-4" style="margin-bottom:18px;">
      <div class="stat-card"><div class="label">Collected Today</div><div class="value">${fmtMoney(sum(todayTxns))}</div><div class="delta">${todayTxns.length} payment${todayTxns.length===1?'':'s'}</div></div>
      <div class="stat-card"><div class="label">This Week</div><div class="value">${fmtMoney(sum(weekTxns))}</div><div class="delta">${weekTxns.length} payments · since Mon</div></div>
      <div class="stat-card"><div class="label">This Month</div><div class="value">${fmtMoney(sum(monthTxns))}</div><div class="delta">${monthTxns.length} payments</div></div>
      <div class="stat-card"><div class="label">Total Wallet Balance</div><div class="value">${fmtMoney(totalBalance)}</div><div class="delta ${lowBalance>0?'down':''}">${lowBalance} learner${lowBalance===1?'':'s'} below ${fmtMoney(STATE.settings.daily_rate||80)}</div></div>
    </div>
    <div class="grid cols-2">
      <div class="panel">
        <div class="panel-head"><h3>Last 7 days</h3><span class="tag">Collections</span></div>
        <div class="chart-bars">
          ${days.map(d=>`<div class="bar-wrap"><div class="bar-val">${d.total? Math.round(d.total/1000*10)/10+'k' : ''}</div><div class="bar ${d.iso===today?'today':''}" style="height:${Math.max(4,(d.total/maxDay)*110)}px;"></div><div class="bar-label">${d.label}</div></div>`).join('')}
        </div>
      </div>
      <div class="panel">
        <div class="panel-head"><h3>Top classes this month</h3><span class="tag gold">By collection</span></div>
        ${classRows.length? classRows.map(([k,v])=>`<div class="kv"><span class="k">${escapeHtml(k)}</span><span class="v">${fmtMoney(v)}</span></div>`).join('') : '<div class="empty">No payments recorded yet this month.</div>'}
      </div>
    </div>
    <div class="panel" style="margin-top:16px;">
      <div class="panel-head"><h3>Recent payments</h3><button class="btn btn-primary btn-sm" id="goPayments">+ Record payment</button></div>
      ${renderTxnTable(allTxnsFlat().slice(0,8))}
    </div>`;
  document.getElementById('goPayments').onclick = ()=> setView('payments');
}

function renderTxnTable(txns){
  if(!txns.length) return '<div class="empty"><h4>No payments yet</h4>Payments you record will show up here.</div>';
  return `<div style="overflow:auto"><table><thead><tr><th>Date</th><th>Learner</th><th>Class</th><th>Amount</th><th>Ref</th><th>Method</th></tr></thead><tbody>
    ${txns.map(t=>{
      const l = findLearner(t.learner_id);
      return `<tr>
        <td>${fmtDate(t.date)}</td>
        <td>${l?escapeHtml(l.name):'<em>Unknown learner</em>'}</td>
        <td>${l?escapeHtml(l.klass||''):''}</td>
        <td class="mono">${fmtMoney(t.amount)}</td>
        <td class="mono">${escapeHtml(t.ref||'—')}</td>
        <td><span class="tag ${t.method==='sms'?'gold':''}">${t.method==='sms'?'Pasted SMS':'Manual'}</span></td>
      </tr>`;
    }).join('')}
  </tbody></table></div>`;
}

/* ===== Learners ===== */
let learnersPage = 1;
const LEARNERS_PER_PAGE = 25;
let learnerFilter = { q:'', klass:'', gender:'', sort:'name' };

function renderLearners(root){
  document.getElementById('topbarActions').innerHTML = `
    <button class="btn btn-ghost btn-sm" id="btnImport">Import CSV/Excel</button>
    <button class="btn btn-primary btn-sm" id="btnAddLearner" style="margin-left:8px;">+ Register learner</button>`;
  const classes = [...new Set(STATE.learners.map(l=>l.klass).filter(Boolean))].sort();
  root.innerHTML = `
    <div class="panel">
      <div class="panel-head"><h3>Find & manage learners</h3><span class="tag">${STATE.learners.length} registered</span></div>
      <div class="search-row">
        <input type="search" class="grow" id="q" placeholder="Search by admission number or name…" value="${escapeHtml(learnerFilter.q)}">
        <select id="fClass"><option value="">Filter by class</option>${classes.map(c=>`<option value="${escapeHtml(c)}" ${learnerFilter.klass===c?'selected':''}>${escapeHtml(c)}</option>`).join('')}</select>
        <select id="fGender"><option value="">Filter by gender</option>
          <option value="Male" ${learnerFilter.gender==='Male'?'selected':''}>Male</option>
          <option value="Female" ${learnerFilter.gender==='Female'?'selected':''}>Female</option>
          <option value="Other" ${learnerFilter.gender==='Other'?'selected':''}>Other</option></select>
        <select id="fSort">
          <option value="name" ${learnerFilter.sort==='name'?'selected':''}>Sort: Name A–Z</option>
          <option value="nameDesc" ${learnerFilter.sort==='nameDesc'?'selected':''}>Sort: Name Z–A</option>
          <option value="adm" ${learnerFilter.sort==='adm'?'selected':''}>Sort: Admission</option>
          <option value="class" ${learnerFilter.sort==='class'?'selected':''}>Sort: Class</option></select>
      </div>
      <div id="learnerTableWrap"></div>
    </div>`;
  document.getElementById('q').oninput = (e)=>{ learnerFilter.q = e.target.value; learnersPage=1; drawLearnerTable(); };
  document.getElementById('fClass').onchange = (e)=>{ learnerFilter.klass = e.target.value; learnersPage=1; drawLearnerTable(); };
  document.getElementById('fGender').onchange = (e)=>{ learnerFilter.gender = e.target.value; learnersPage=1; drawLearnerTable(); };
  document.getElementById('fSort').onchange = (e)=>{ learnerFilter.sort = e.target.value; learnersPage=1; drawLearnerTable(); };
  document.getElementById('btnImport').onclick = openImportModal;
  document.getElementById('btnAddLearner').onclick = ()=> openLearnerFormModal(null);
  drawLearnerTable();
}

function filteredLearners(){
  const q = learnerFilter.q.trim().toLowerCase();
  let list = STATE.learners.filter(l=>{
    if(learnerFilter.klass && l.klass !== learnerFilter.klass) return false;
    if(learnerFilter.gender && (l.gender||'') !== learnerFilter.gender) return false;
    if(q && !(l.name||'').toLowerCase().includes(q) && !String(l.adm||'').toLowerCase().includes(q)) return false;
    return true;
  });
  const cmp = (a,b)=>String(a||'').localeCompare(String(b||''), undefined, {numeric:true, sensitivity:'base'});
  if(learnerFilter.sort==='name') list.sort((a,b)=>cmp(a.name,b.name));
  if(learnerFilter.sort==='nameDesc') list.sort((a,b)=>cmp(b.name,a.name));
  if(learnerFilter.sort==='adm') list.sort((a,b)=>cmp(a.adm,b.adm));
  if(learnerFilter.sort==='class') list.sort((a,b)=>cmp(a.klass,b.klass)||cmp(a.name,b.name));
  return list;
}

function drawLearnerTable(){
  const wrap = document.getElementById('learnerTableWrap');
  if(!wrap) return;
  const list = filteredLearners();
  const totalPages = Math.max(1, Math.ceil(list.length/LEARNERS_PER_PAGE));
  learnersPage = Math.min(learnersPage, totalPages);
  const start = (learnersPage-1)*LEARNERS_PER_PAGE;
  const pageItems = list.slice(start, start+LEARNERS_PER_PAGE);
  const rate = Number(STATE.settings.daily_rate||80);
  wrap.innerHTML = `
    <div style="overflow:auto;"><table>
      <thead><tr><th>Card No.</th><th>Name</th><th>Adm No.</th><th>Class</th><th>Gender</th><th>Stream</th><th>Balance</th><th>Actions</th></tr></thead>
      <tbody>
        ${pageItems.length? pageItems.map(l=>`
          <tr>
            <td class="mono">${escapeHtml(l.card_no)}</td>
            <td><strong>${escapeHtml(l.name)}</strong></td>
            <td class="mono">${escapeHtml(l.adm)}</td>
            <td>${escapeHtml(l.klass||'')}</td>
            <td>${escapeHtml(l.gender||'—')}</td>
            <td>${escapeHtml(l.stream||'')}</td>
            <td class="${Number(l.balance)<rate?'balance-low':'balance-ok'}">${fmtMoney(l.balance)}</td>
            <td style="white-space:nowrap;">
              <button class="btn btn-ghost btn-sm" data-act="view" data-id="${l.id}">Profile</button>
              <button class="btn btn-ghost btn-sm" data-act="edit" data-id="${l.id}">Edit</button>
              <button class="btn btn-danger btn-sm" data-act="delete" data-id="${l.id}">Delete</button>
              <button class="btn btn-primary btn-sm" data-act="print" data-id="${l.id}">Print</button>
            </td>
          </tr>`).join('') : `<tr><td colspan="8"><div class="empty"><h4>No learners match</h4>Try clearing the search or filter.</div></td></tr>`}
      </tbody></table></div>
    <div class="pagination">
      <span>${list.length.toLocaleString()} learner${list.length===1?'':'s'}</span>
      <button id="pPrev" ${learnersPage<=1?'disabled':''}>&larr; Prev</button>
      <span>Page ${learnersPage} of ${totalPages}</span>
      <button id="pNext" ${learnersPage>=totalPages?'disabled':''}>Next &rarr;</button>
    </div>`;
  wrap.querySelectorAll('[data-act="view"]').forEach(b=> b.onclick = ()=> openLearnerProfile(b.dataset.id));
  wrap.querySelectorAll('[data-act="edit"]').forEach(b=> b.onclick = ()=> openLearnerFormModal(findLearner(b.dataset.id)));
  wrap.querySelectorAll('[data-act="delete"]').forEach(b=> b.onclick = async ()=>{
    const l=findLearner(b.dataset.id);
    if(!l || !confirm('Delete '+l.name+' (Admission '+l.adm+')?')) return;
    STATE.learners=STATE.learners.filter(x=>x.id!==l.id);
    await saveLearners();
    toast('Learner deleted');
    drawLearnerTable();
  });
  wrap.querySelectorAll('[data-act="print"]').forEach(b=> b.onclick = ()=> printLearnerDetails(findLearner(b.dataset.id)));
  const prev = document.getElementById('pPrev'), next = document.getElementById('pNext');
  if(prev) prev.onclick = ()=>{ learnersPage--; drawLearnerTable(); };
  if(next) next.onclick = ()=>{ learnersPage++; drawLearnerTable(); };
}

function openLearnerFormModal(learner){
  const isEdit = !!learner;
  openModal(`
    <h3>${isEdit?'Edit learner':'Register learner'}</h3>
    <div class="field"><label>Full name</label><input type="text" id="fName" value="${isEdit?escapeHtml(learner.name):''}"></div>
    <div class="field-row">
      <div class="field"><label>Admission number</label><input type="text" id="fAdm" value="${isEdit?escapeHtml(learner.adm):''}"></div>
      <div class="field"><label>Gender</label><select id="fGenderSel">
        <option value="">Select gender</option>
        <option value="Male" ${isEdit&&learner.gender==='Male'?'selected':''}>Male</option>
        <option value="Female" ${isEdit&&learner.gender==='Female'?'selected':''}>Female</option>
        <option value="Other" ${isEdit&&learner.gender==='Other'?'selected':''}>Other</option></select></div>
    </div>
    <div class="field-row">
      <div class="field"><label>Class</label><input type="text" id="fKlass" value="${isEdit?escapeHtml(learner.klass||''):''}"></div>
      <div class="field"><label>Stream (optional)</label><input type="text" id="fStream" value="${isEdit?escapeHtml(learner.stream||''):''}"></div>
    </div>
    ${isEdit? `<div class="helptext">Meal card number: <strong class="mono">${escapeHtml(learner.card_no)}</strong></div>`:''}
    <div class="helptext">Money is added through Payments, so every shilling has a record.</div>
    <div class="modal-actions">
      <button class="btn btn-ghost" id="btnCancel">Cancel</button>
      <button class="btn btn-primary" id="btnSaveLearner">${isEdit?'Save changes':'Register & issue card'}</button>
    </div>`, ()=>{
    document.getElementById('btnCancel').onclick = closeModal;
    document.getElementById('btnSaveLearner').onclick = async ()=>{
      const name = document.getElementById('fName').value.trim();
      const adm = document.getElementById('fAdm').value.trim();
      const gender = document.getElementById('fGenderSel').value;
      const klass = document.getElementById('fKlass').value.trim();
      const stream = document.getElementById('fStream').value.trim();
      if(!name || !adm){ toast('Name and admission number are required', true); return; }
      if(isEdit){ Object.assign(learner, {name, adm, gender, klass, stream}); }
      else {
        if(STATE.learners.some(l=>String(l.adm).toLowerCase()===adm.toLowerCase())){ toast('That admission number is already registered', true); return; }
        STATE.learners.push({ id: uid(), card_no: nextCardNumber(), adm, name, gender, klass, stream, balance: 0, created_at: todayISO() });
      }
      await saveLearners();
      closeModal();
      toast(isEdit?'Learner updated':'Learner registered and card issued');
      if(STATE.view==='learners') drawLearnerTable();
    };
  });
}

function printLearnerDetails(l){
  if(!l) return;
  const history = allTxnsFlat().filter(t=>t.learner_id===l.id);
  const area = document.getElementById('printArea');
  area.innerHTML = `
    <div class="learner-print-sheet">
      <h1>${escapeHtml(STATE.settings.school_name||'School')}</h1>
      <h2>Learner Details</h2>
      <div class="print-kv"><b>Name</b><span>${escapeHtml(l.name)}</span></div>
      <div class="print-kv"><b>Admission Number</b><span>${escapeHtml(l.adm)}</span></div>
      <div class="print-kv"><b>Class</b><span>${escapeHtml(l.klass||'—')}</span></div>

      <div class="print-kv"><b>Stream</b><span>${escapeHtml(l.stream||'—')}</span></div>
      <div class="print-kv"><b>Meal Card</b><span>${escapeHtml(l.card_no)}</span></div>
      <div class="print-kv"><b>Total paid</b><span>${fmtMoney(l.balance)}</span></div>
      <div class="print-kv"><b>Meal days covered</b><span>${learnerMealDays(l)}</span></div>

    </div>`;

  area.style.display='block';
  setTimeout(()=>{ window.print(); area.style.display='none'; area.id='printArea'; },80);
}

function openLearnerProfile(id){
  const l = findLearner(id);
  if(!l) return;
  const history = allTxnsFlat().filter(t=>t.learner_id===id);
  const total = history.reduce((a,t)=>a+Number(t.amount||0),0);

    <h3>${escapeHtml(l.name)}</h3>
    <div class="kv"><span class="k">Meal card no.</span><span class="v mono">${escapeHtml(l.card_no)}</span></div>
    <div class="kv"><span class="k">Admission no.</span><span class="v mono">${escapeHtml(l.adm)}</span></div>
    <div class="kv"><span class="k">Class / Stream</span><span class="v">${escapeHtml(l.klass||'—')} ${escapeHtml(l.stream||'')}</span></div>
    <div class="kv"><span class="k">Current balance</span><span class="v">${fmtMoney(l.balance)}</span></div>
    <div class="kv"><span class="k">Lifetime paid in</span><span class="v">${fmtMoney(total)}</span></div>
    <h4 style="margin-top:16px;font-size:14px;">Payment history</h4>
    <div style="max-height:220px;overflow:auto;margin-top:8px;">${history.length? renderTxnTable(history) : '<div class="empty">No payments recorded for this learner yet.</div>'}</div>
    <div class="modal-actions">
      <button class="btn btn-ghost" id="btnClose">Close</button>
      <button class="btn btn-ghost" id="btnPrintDetails">Print details</button><button class="btn btn-ghost" id="btnPrintOne">Print card</button>
      <button class="btn btn-primary" id="btnPayNow">Record payment</button>
    </div>`, ()=>{
    document.getElementById('btnClose').onclick = closeModal;
    document.getElementById('btnPrintDetails').onclick = ()=>{ closeModal(); printLearnerDetails(l); };
    document.getElementById('btnPrintOne').onclick = ()=>{ closeModal(); printCards([l]); };
    document.getElementById('btnPayNow').onclick = ()=>{ closeModal(); paymentsTab='manual'; setView('payments'); setTimeout(()=>selectLearnerForManualPay(l.id), 50); };
  });

/* ----- CSV import ----- */
function openImportModal(){
  openModal(`
    <h3>Import learners</h3>
    <p style="font-size:13px;color:var(--muted);margin-top:-6px;">Upload a CSV with columns for admission number, name, class, gender (optional) and stream (optional).</p>
    <div class="dropzone" id="dz">
      <input type="file" id="fileInput" accept=".csv,.txt" style="display:none;">
      <div>Drag a CSV file here, or</div>
      <button class="btn btn-ghost btn-sm" id="btnBrowse" style="margin-top:8px;">Choose file</button>
      <div class="helptext">Tip: export your Excel sheet as CSV first (File → Save As → CSV).</div>
    </div>
    <div id="importPreview"></div>
    <div class="modal-actions">
      <button class="btn btn-ghost" id="btnCancelImport">Cancel</button>
      <button class="btn btn-primary" id="btnConfirmImport" disabled>Import 0 learners</button>
    </div>`, ()=>{
    let parsedRows = [];
    const dz = document.getElementById('dz');
    const fileInput = document.getElementById('fileInput');
    document.getElementById('btnBrowse').onclick = ()=> fileInput.click();
    document.getElementById('btnCancelImport').onclick = closeModal;
    ['dragover','dragenter'].forEach(evt=> dz.addEventListener(evt, e=>{ e.preventDefault(); dz.classList.add('drag'); }));
    ['dragleave','drop'].forEach(evt=> dz.addEventListener(evt, e=>{ e.preventDefault(); dz.classList.remove('drag'); }));
    dz.addEventListener('drop', e=>{ const f = e.dataTransfer.files[0]; if(f) handleFile(f); });
    fileInput.onchange = ()=>{ if(fileInput.files[0]) handleFile(fileInput.files[0]); };
    function pick(row, candidates){
      const keys = Object.keys(row);
      for(const c of candidates){
        const k = keys.find(k=>k.trim().toLowerCase().replace(/[^a-z0-9]/g,'') === c);
        if(k) return row[k];
      }
      return '';
    }
    function handleFile(f){
      Papa.parse(f, { header:true, skipEmptyLines:true, complete: (res)=>{
        parsedRows = res.data.map(row=>({
          adm: String(pick(row,['admissionno','admission','admno','admissionnumber','adm']) || '').trim(),
          name: String(pick(row,['name','fullname','learnername','studentname']) || '').trim(),
          klass: String(pick(row,['class','klass','grade']) || '').trim(),
          stream: String(pick(row,['stream']) || '').trim(),
          gender: String(pick(row,['gender','sex']) || '').trim(),
        })).filter(r=>r.adm && r.name);
        const dupCount = parsedRows.filter(r=> STATE.learners.some(l=>String(l.adm).toLowerCase()===r.adm.toLowerCase())).length;
        document.getElementById('importPreview').innerHTML = `
          <div class="panel" style="margin-top:12px;">
            <div style="font-size:13.5px;margin-bottom:8px;"><strong>${parsedRows.length}</strong> learners found in file ${dupCount? `· <span style="color:var(--rust);">${dupCount} already registered (will be skipped)</span>`:''}</div>
            <div style="max-height:180px;overflow:auto;"><table><thead><tr><th>Adm No.</th><th>Name</th><th>Class</th><th>Gender</th><th>Stream</th></tr></thead>
            <tbody>${parsedRows.slice(0,8).map(r=>`<tr><td class="mono">${escapeHtml(r.adm)}</td><td>${escapeHtml(r.name)}</td><td>${escapeHtml(r.klass)}</td><td>${escapeHtml(r.gender||'')}</td><td>${escapeHtml(r.stream)}</td></tr>`).join('')}</tbody></table></div>
            ${parsedRows.length>8? `<div class="helptext">…and ${parsedRows.length-8} more</div>`:''}
          </div>`;
        const btn = document.getElementById('btnConfirmImport');
        const newCount = parsedRows.length - dupCount;
        btn.disabled = newCount<=0;
        btn.textContent = `Import ${newCount} learner${newCount===1?'':'s'}`;
      }});
    }
    document.getElementById('btnConfirmImport').onclick = async ()=>{
      let added = 0;
      for(const r of parsedRows){
        if(STATE.learners.some(l=>String(l.adm).toLowerCase()===r.adm.toLowerCase())) continue;
        STATE.learners.push({ id: uid(), card_no: nextCardNumber(), adm:r.adm, name:r.name, klass:r.klass, stream:r.stream, gender:r.gender, balance:0, created_at: todayISO() });
        added++;
      }
      await saveLearners();
      closeModal();
      toast(added+' learners imported and cards issued');
      if(STATE.view==='learners') drawLearnerTable();
    };
  });
}

/* ===== Payments ===== */
let paymentsTab = 'manual';
let manualSelectedLearner = null;

function renderPayments(root){
  root.innerHTML = `
    <div class="tabs">
      <button data-t="manual" class="${paymentsTab==='manual'?'active':''}">Manual verification</button>
      <button data-t="sms" class="${paymentsTab==='sms'?'active':''}">Paste bank notification</button>
    </div>
    <div id="payBody"></div>`;
  root.querySelectorAll('.tabs button').forEach(b=> b.onclick = ()=>{ paymentsTab=b.dataset.t; renderPayments(root); });
  paymentsTab==='manual' ? drawManualPay() : drawSmsPay();
}

function drawManualPay(){
  const body = document.getElementById('payBody');
  body.innerHTML = `

async function creditWallet(learner, amount, ref, date, method, note){
  const mk = monthKeyOf(date);

  if(!STATE.txnMonths.includes(mk)) STATE.txnMonths.push(mk);

}

/* ----- Paste SMS ----- */
function parseBankSms(text){
  const out = { amount:null, ref:null, date:null, klass:null, adm:null, firstName:null, rawAccount:null };
  const t = text.replace(/\u00a0/g,' ');
  const amtMatch = t.match(/Ksh\.?\s?([\d,]+(?:\.\d{1,2})?)/i) || t.match(/KES\.?\s?([\d,]+(?:\.\d{1,2})?)/i);
  if(amtMatch) out.amount = parseFloat(amtMatch[1].replace(/,/g,''));
  const refMatch = t.match(/^\s*([A-Z0-9]{8,12})\s+Confirmed/i) || t.match(/\b([A-Z]{2}[A-Z0-9]{7,10})\b/);
  if(refMatch) out.ref = refMatch[1].toUpperCase();
  const acctMatch = t.match(/account\s*(?:number)?\s*[:\-]?\s*([A-Za-z0-9#]+)/i);
  if(acctMatch) out.rawAccount = acctMatch[1];
  else { const hashMatch = t.match(/\d+#([A-Za-z0-9]+)/); if(hashMatch) out.rawAccount = hashMatch[1]; }
  if(out.rawAccount){
    const acct = out.rawAccount.includes('#') ? out.rawAccount.split('#').pop() : out.rawAccount;
    const m = acct.match(/^(\d{0,2}[A-Za-z]{0,2})(\d{2,6})([A-Za-z]*)$/);
    if(m){ out.klass = m[1] || null; out.adm = m[2] || null; out.firstName = m[3] || null; }
  }
  const dateMatch = t.match(/on\s+(\d{1,2}\/\d{1,2}\/\d{2,4})/i) || t.match(/(\d{1,2}\/\d{1,2}\/\d{2,4})/);
  if(dateMatch){
    let [d,mo,y] = dateMatch[1].split('/').map(x=>parseInt(x,10));
    if(y<100) y += 2000;
    out.date = `${y}-${String(mo).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
  }
  return out;
}

  if(p==='term'){ const d = new Date(); d.setMonth(d.getMonth()-3); reportRange = {start:d.toISOString().slice(0,10), end:today, preset:p}; }

function exportReportCsv(){

/* ---------- fee helpers (Mon-Fri only, minus holidays; rate in effect on each day) ---------- */
function rateOn(iso){ let r = 80; D.rates.forEach(x => { if(x.effective_from <= iso) r = x.rate; }); return r; }
function schoolDays(s, e, hol){
  const out = [], d = new Date(s+'T00:00:00Z'), end = new Date(e+'T00:00:00Z');
  for(; d <= end; d.setUTCDate(d.getUTCDate()+1)){ const w = d.getUTCDay(), iso = d.toISOString().slice(0,10); if(w && w < 6 && (hol||[]).indexOf(iso) < 0) out.push(iso); }
  return out;
}
const fee = list => list.reduce((a,d) => a + rateOn(d), 0);
function currentTerm(){ const t = todayISO(); return D.terms.find(x => x.start <= t && t <= x.end) || D.terms[D.terms.length-1]; }

/* ---------- meal-credit status (assumes one meal per school day since term start) ---------- */
function credit(l){
  const t = currentTerm(), today = todayISO(); let spent = 0;
  if(t && today >= t.start){ const e = today < t.end ? today : t.end; spent = fee(schoolDays(t.start, e, t.holidays)); }
  const rate = rateOn(today) || 80, rem = Number(l.balance || 0) - spent;
  return {rem, days:Math.max(0, Math.floor(rem / rate))};
}
function pstatus(l){ const d = credit(l).days; return d <= 0 ? {c:'out', t:'Exhausted', d} : d <= 2 ? {c:'low', t:'Low · ' + d + ' day' + (d === 1 ? '' : 's'), d} : {c:'ok', t:'Paid · ' + d + ' days', d}; }
const badge = l => { const s = pstatus(l); return '<span class="sb ' + s.c + '">' + s.t + '</span>'; };

/* ---------- count-up numbers ---------- */
function countUp(root){
  root.querySelectorAll('.stat-card .value').forEach(el => {
    const m = el.textContent.trim().match(/^(KSh\s)?([\d,]+)$/); if(!m) return;
    const end = +m[2].replace(/,/g, ''), pre = m[1] || '', t0 = performance.now();
    (function f(t){ const p = Math.min(1, (t - t0) / 1000), e = 1 - Math.pow(1 - p, 3); el.textContent = pre + Math.round(end * e).toLocaleString('en-KE'); if(p < 1) requestAnimationFrame(f); })(t0);
  });
}

  const rows = repRows(), wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(groupRows(rows).map(([k, v]) => ({[GL[RF.group]]:k, Payments:v.n, 'Total (KSh)':v.t}))), 'Summary');
  XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(rows.map(r => ({Date:r.date, Learner:r.learner, 'Admission No':r.adm, Class:r.klass, 'Amount (KSh)':r.amount, Reference:r.ref, Method:r.method, Status:r.status, 'Recorded by':r.teacher, Term:r.term}))), 'Transactions');
  XLSX.writeFile(wb, 'Meal_Report_' + todayISO() + '.xlsx');
}
function printReport(){
  const rows = repRows(), g = groupRows(rows), tot = rows.reduce((a, r) => a + r.amount, 0);
  const filt = [RF.from && 'From ' + RF.from, RF.to && 'To ' + RF.to, RF.klass && 'Class ' + RF.klass, RF.method && RF.method, RF.term && RF.term, RF.teacher && 'By ' + RF.teacher, RF.q && 'Learner "' + RF.q + '"'].filter(Boolean).join(' · ') || 'All records';
  doPrint('<div class="learner-print-sheet" style="max-width:none"><h1>' + escapeHtml(STATE.settings.school_name || 'School') + '</h1><h2>Meal Payments Report</h2><p style="font-size:12px">' + escapeHtml(filt) + ' · Generated ' + new Date().toLocaleString('en-GB') + ' · Total ' + fmtMoney(tot) + ' (' + rows.length + ' payments)</p><h3>Summary by ' + GL[RF.group].toLowerCase() + '</h3>' + tbl([GL[RF.group], 'Payments', 'Total'], g.map(([k, v]) => [escapeHtml(k), v.n, fmtMoney(v.t)])) + '<h3 style="margin-top:16px">Transactions</h3>' + tbl(['Date', 'Learner', 'Class', 'Amount', 'Ref', 'Method', 'Status', 'By'], rows.map(r => [r.date, escapeHtml(r.learner), escapeHtml(r.klass), fmtMoney(r.amount), escapeHtml(r.ref), escapeHtml(r.method), escapeHtml(r.status), escapeHtml(r.teacher)])) + '</div>');
}
window.renderReports = function(root){
  const classes = [...new Set(STATE.learners.map(l => l.klass).filter(Boolean))].sort(), teachers = [...new Set(D.payments.map(p => p.recorded_by).filter(Boolean))].sort();
  const opt = (arr, cur, ph) => '<option value="">' + ph + '</option>' + arr.map(x => '<option ' + (x === cur ? 'selected' : '') + '>' + escapeHtml(x) + '</option>').join('');
  const f = (lab, inner) => '<div class="field"><label>' + lab + '</label>' + inner + '</div>';
  root.innerHTML = '<div class="panel"><div class="panel-head"><h3>Advanced reports</h3><div style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn btn-ghost btn-sm" id="rfClear">Clear filters</button><button class="btn btn-primary btn-sm" id="rfXlsx">Export Excel</button><button class="btn btn-primary btn-sm" id="rfPdf">Export PDF</button></div></div><div class="grid cols-4" style="gap:4px 12px">' +
    f('From', '<input type="date" id="rfFrom" value="' + RF.from + '">') + f('To', '<input type="date" id="rfTo" value="' + RF.to + '">') +
    f('Class', '<select id="rfClass">' + opt(classes, RF.klass, 'All classes') + '</select>') + f('Payment method', '<select id="rfMethod">' + opt(['Manual', 'Pasted SMS'], RF.method, 'All methods') + '</select>') +
    f('Term', '<select id="rfTerm">' + opt(D.terms.map(t => t.name + ' ' + t.year).concat(['No term']), RF.term, 'All terms') + '</select>') + f('Recorded by (teacher)', '<select id="rfTeacher">' + opt(teachers, RF.teacher, 'All teachers') + '</select>') +
    f('Status', '<select id="rfStatus"><option value="">Not rejected</option>' + ['Verified', 'Pending verification', 'Rejected'].map(s => '<option ' + (RF.status === s ? 'selected' : '') + '>' + s + '</option>').join('') + '</select>') + f('Learner name / adm', '<input type="search" id="rfQ" value="' + escapeHtml(RF.q) + '">') +
    f('Group summary by', '<select id="rfGroup">' + Object.keys(GL).map(k => '<option value="' + k + '" ' + (RF.group === k ? 'selected' : '') + '>' + GL[k] + '</option>').join('') + '</select>') +
    '</div><div class="helptext">PDF opens the print dialog: choose "Save as PDF". Excel includes a Summary sheet and a Transactions sheet.</div></div><div id="rfBody"></div>';
  const map = {rfFrom:'from', rfTo:'to', rfClass:'klass', rfMethod:'method', rfTerm:'term', rfTeacher:'teacher', rfStatus:'status', rfQ:'q', rfGroup:'group'};
  Object.keys(map).forEach(id => { $(id).oninput = () => { RF[map[id]] = $(id).value; drawRep(); }; });
  $('rfClear').onclick = () => { RF = {from:'', to:'', klass:'', method:'', term:'', teacher:'', status:'', q:'', group:RF.group}; window.renderReports(root); };
  $('rfXlsx').onclick = e => busy(e.currentTarget, exportXlsx);
  $('rfPdf').onclick = e => busy(e.currentTarget, printReport);
  drawRep();
};

/* ---------- backup & recovery (admin) ---------- */
async function renderBackup(root){
  root.innerHTML = '<div class="panel"><div class="panel-head"><h3>Backups</h3><div style="display:flex;gap:8px"><button class="btn btn-ghost btn-sm" id="bkAlerts">Send low-balance alerts now</button><button class="btn btn-primary btn-sm" id="bkNow">Back up now</button></div></div><div class="helptext">Backups are private copies of the whole spreadsheet kept in a restricted Drive folder (latest 30 kept). Daily automatic backups (2am) and alerts (7am) are switched on by running <b>installTriggers</b> once in Apps Script.</div><div id="bkList" style="margin-top:12px"><div class="sk" style="height:90px"></div></div></div><div class="panel"><div class="panel-head"><h3>Deleted learners</h3></div><div id="bkDel"><div class="sk" style="height:60px"></div></div></div>';
  $('bkNow').onclick = guard(async () => { const r = await api('runBackup'); toast('Backup created: ' + r.name); renderBackup(root); });
  $('bkAlerts').onclick = guard(async () => { const r = await api('sendAlerts'); toast(r.learners + ' learners low · ' + r.emails + ' email(s) sent'); });
  try{
    const list = await api('listBackups', null, true);
    $('bkList').innerHTML = tbl(['Backup', 'Created', '', ''], list.map(b => [escapeHtml(b.name), b.created, '<a href="' + escapeHtml(b.url) + '" target="_blank" rel="noopener">Open (owner only)</a>', '<button class="btn btn-danger btn-sm" data-r="' + b.id + '">Restore…</button>']));
    root.querySelectorAll('[data-r]').forEach(b => b.onclick = () => {
      const tabs = ['Learners', 'Payments', 'Teachers', 'Terms', 'MealRates', 'Corrections', 'Settings'];
      openModal('<h3>Restore from backup</h3><p class="helptext" style="margin:-6px 0 10px">A safety backup of the current data is made first. The tabs you tick are replaced by the backup version.</p>' + tabs.map(t => '<label style="font-weight:500"><input type="checkbox" class="rtab" value="' + t + '" style="width:auto;margin-right:8px">' + t + '</label>').join('') + '<div class="modal-actions"><button class="btn btn-ghost" id="rsNo">Cancel</button><button class="btn btn-danger" id="rsGo">Restore selected</button></div>', () => {
        $('rsNo').onclick = closeModal;
        $('rsGo').onclick = guard(async () => { const sel = [...document.querySelectorAll('.rtab:checked')].map(x => x.value); if(!sel.length) throw new Error('Tick at least one tab'); if(!confirm('Replace ' + sel.join(', ') + ' with the backup version?')) return; await api('restoreTabs', {id:b.dataset.r, tabs:sel}); closeModal(); await sync(); toast('Restored. Data reloaded.'); renderBackup(root); });
      });
    });
    const del = await api('listDeleted', null, true);
    $('bkDel').innerHTML = del.length ? tbl(['Name', 'Adm', 'Class', ''], del.map(l => [escapeHtml(l.name), escapeHtml(l.adm), escapeHtml(l.klass), '<button class="btn btn-ghost btn-sm" data-d="' + l.id + '">Restore</button>'])) : '<div class="empty"><h4>No deleted learners</h4>Deleted learners are kept here so they can be recovered.</div>';
    root.querySelectorAll('[data-d]').forEach(b => b.onclick = guard(async () => { await api('restoreLearner', {id:b.dataset.d}); await sync(); toast('Learner restored'); renderBackup(root); }));
  }catch(e){ toast(e.message, true); }
}
EXT.backup = renderBackup; VIEW_TITLES.backup = ['Backup & Recovery', 'Private backups and record recovery'];

})();

</script>
